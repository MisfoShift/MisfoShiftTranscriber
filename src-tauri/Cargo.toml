[package]
name = "misfo-shift-transcriber"
version = "0.1.0"
description = "A local-first Windows transcription tool"
authors = ["MisfoShift"]
edition = "2021"

[lib]
name = "misfo_shift_transcriber_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "misfo-shift-transcriber"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util"] }
cpal = "0.15"
hound = "3.5"
tempfile = "3"
futures-util = "0.3"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
